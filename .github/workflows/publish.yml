name: Publish Packages to GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish OmniBackend Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Publication Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0"
          fi
          echo "PUBLISH_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Run Quality Checks & Unit Tests
        run: ./gradlew detekt testDebugUnitTest

      - name: Publish all modules to GitHub Packages
        run: ./gradlew publish -Pversion=${{ env.PUBLISH_VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Job Summary
        if: always()
        run: |
          echo "### 📦 OmniBackend Android Packages Published" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${{ env.PUBLISH_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Maven Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Core | \`br.wgc.omnibackend:core:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase | \`br.wgc.omnibackend:backend-firebase:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase | \`br.wgc.omnibackend:backend-supabase:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Appwrite | \`br.wgc.omnibackend:backend-appwrite:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Back4App | \`br.wgc.omnibackend:backend-back4app:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Amplify | \`br.wgc.omnibackend:backend-amplify:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PocketBase | \`br.wgc.omnibackend:backend-pocketbase:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom REST | \`br.wgc.omnibackend:backend-rest:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare | \`br.wgc.omnibackend:backend-cloudflare:${{ env.PUBLISH_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
