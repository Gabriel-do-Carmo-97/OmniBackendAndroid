      - foundation-testing
      - driver-firebase
      - driver-supabase
      - driver-appwrite
      - driver-pocketbase
      - driver-back4app
      - driver-amplify
      - driver-cloudflare
      - driver-rest
      - bundle-hybrid
      - bundle-self-hosted
      - bundle-cloud-native
      - bundle-enterprise-hybrid
      - bundle-edge-serverless
      - bundle-baas-classic
      - bundle-all
      - bundle-firebase-supabase
      - bundle-firebase-amplify
      - bundle-firebase-back4app
      - bundle-supabase-cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 🚀 Build App Sample (Assemble Debug)
        run: ./gradlew :app:assembleDebug
      - name: ⬆️ Upload Sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # =============================================================================
  # NIVEL 5: PUBLISH & RELEASE UNIFICADO (Padrao CommonsAndroidNative)
  # =============================================================================

  publish-and-release:
    name: "🚀 Publish & Release"
    needs: [sample-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat"
          bump_each_commit_patch_pattern: "fix|refactor"
          version_format: "${major}.${minor}.${patch}"

      - name: Detect changed library modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            core/**
            testing/**
            backend/**
            bundle/**
            build-logic/**
            gradle/libs.versions.toml

      - name: Setup Android & Java Environment
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-android-env

      - name: Publish all modules to GitHub Packages
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER || github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -PVERSION_NAME=${{ steps.semver.outputs.version }} --no-daemon

      - name: Download All Release AARs
        if: steps.changed_modules.outputs.any_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-aar-*
          merge-multiple: true
          path: ./all-release-aars

      - name: Configure GitHub Access
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.semver.outputs.version }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME" || true

      - name: Create Release
        if: steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.semver.outputs.version }}"
          mapfile -t AAR_FILES < <(find ./all-release-aars -type f -name "*-release.aar" 2>/dev/null || true)
          if [ ${#AAR_FILES[@]} -gt 0 ]; then
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes \
              "${AAR_FILES[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi

  # =============================================================================
  # NIVEL 6: DEPLOY DE DOCUMENTACAO DOKKA NO GITHUB PAGES
  # =============================================================================

  deploy-docs:
    name: "Deploy Dokka Docs to GitHub Pages"
    needs: [publish-and-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: Generate Dokka HTML
        run: ./gradlew dokkaGeneratePublicationHtml --continue || true
      - name: Consolidate Documentation Pages
        run: |
          mkdir -p ./site-docs
          find . -type d -path "*/build/dokka/html" -exec cp -r {}/* ./site-docs/ \; 2>/dev/null || true
          if [ ! -f ./site-docs/index.html ]; then
            echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>OmniBackend Android API Documentation</title></head><body><h1>OmniBackend Android API Documentation</h1><p>API documentation generated via Dokka for enterprise bundles and backend drivers.</p></body></html>" > ./site-docs/index.html
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site-docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
