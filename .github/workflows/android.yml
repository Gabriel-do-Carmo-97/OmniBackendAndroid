name: Android CI/CD Pipeline (Pro Enterprise)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  # =============================================================================
  # PR VALIDATION: CONVENTIONAL COMMITS
  # =============================================================================
  semantic-pull-request:
    name: "PR: Validate Conventional Title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            perf
            build
          requireScope: false

  # =============================================================================
  # BUILD, TEST, QUALITY & PUBLISH
  # =============================================================================
  build_Test_and_Publish:
    name: Build, Test, Quality & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            core/**
            backend/**
            bundle/**
            build-logic/**
            gradle/**

      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env

      - name: 🔍 Run Detekt Static Analysis
        run: ./gradlew detekt

      - name: 🧪 Run Unit Tests Across All Modules
        run: ./gradlew testDebugUnitTest

      - name: 📚 Generate Dokka API Documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: 📦 Build Release AARs
        run: ./gradlew assembleRelease

      - name: ⬆️ Upload Release AARs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: ./**/build/outputs/aar/*-release.aar
          if-no-files-found: ignore

      # ─── Publicação dos Módulos para GitHub Packages ──────────────────────

      - name: 📦 Publish Changed Modules to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Publishing modules for run number: ${{ github.run_number }}"
          
          # Publicar Core se alterado
          if echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "core/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "build-logic/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "gradle/"; then
            echo "Publishing :core to GitHub Packages..."
            ./gradlew ":core:publish" --no-daemon
          fi

          # Publicar Drivers da pasta backend/
          for b in firebase supabase appwrite back4app amplify pocketbase rest cloudflare; do
            if echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "backend/$b/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "build-logic/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "gradle/"; then
              echo "Publishing :backend:$b to GitHub Packages..."
              ./gradlew ":backend:$b:publish" --no-daemon
            fi
          done

          # Publicar Bundles da pasta bundle/
          for bun in hybrid self-hosted cloud-native all; do
            if echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "bundle/$bun/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "build-logic/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "gradle/"; then
              echo "Publishing :bundle:$bun to GitHub Packages..."
              ./gradlew ":bundle:$bun:publish" --no-daemon
            fi
          done

      # ─── Criar Tag e Release no GitHub ─────────────────────────────────────

      - name: Configure GitHub Access
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag and Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          AAR_FILES=$(find . -path '*/build/outputs/aar/*-release.aar' 2>/dev/null | tr '\n' ' ')
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release automático gerado pela esteira de CI/CD.
            
          **Versão Publicada**: \`0.0.${{ github.run_number }}\`
          **Mudanças detectadas em**:
          ${{ steps.changed_modules.outputs.all_changed_files }}" \
            $AAR_FILES
