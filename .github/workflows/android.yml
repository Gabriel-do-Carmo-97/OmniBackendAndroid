name: Android CI/CD Pipeline (Hyper-Granular Pro)

on:
  push:
    branches: [ "master", "feat/**" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GPR_USER: ${{ secrets.GPR_USER || github.actor }}
  GPR_KEY: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

jobs:
  # =============================================================================
  # PR VALIDATION: CONVENTIONAL COMMITS
  # =============================================================================

  semantic-pull-request:
    name: "PR: Validate Conventional Title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            perf
            build
          requireScope: false

  # =============================================================================
  # NIVEL 1: FUNDACAO AGNOSTICA & TESTES
  # =============================================================================

  foundation-core:
    name: "foundation: core"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 🔍 Spotless, API Check, Detekt, Testes e Build
        run: |
          ./gradlew \
            spotlessCheck \
            apiCheck \
            :core:detekt \
            :core:testDebugUnitTest \
            :core:assembleRelease \
            :core:assembleDebug
      - name: 📊 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-foundation-core
          path: |
            core/build/reports/tests/
            core/build/reports/detekt/
          if-no-files-found: ignore
      - name: ⬆️ Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-foundation-core
          path: core/build/outputs/aar/*-release.aar
          if-no-files-found: error
      - name: ⬆️ Upload Debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: debug-aar-foundation-core
          path: core/build/outputs/aar/*-debug.aar
          if-no-files-found: ignore

  foundation-testing:
    name: "foundation: testing"
    needs: [foundation-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - name: Setup Android & Java Environment
        uses: ./.github/actions/setup-android-env
      - name: 🔍 Detekt, Testes e Build
        run: |
          ./gradlew \
            :testing:detekt \
            :testing:testDebugUnitTest \
            :testing:assembleRelease \
            :testing:assembleDebug
      - name: 📊 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-foundation-testing
