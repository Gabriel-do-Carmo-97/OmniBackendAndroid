name: Android CI, Test, Quality & Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build_Test_and_Publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed modules
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            core/**
            backend-firebase/**
            backend-supabase/**
            backend-appwrite/**
            backend-back4app/**
            backend-amplify/**
            backend-pocketbase/**
            backend-rest/**
            backend-cloudflare/**
            build-logic/**
            gradle/**

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔍 Run Detekt Static Analysis
        run: ./gradlew detekt

      - name: 🧪 Run Unit Tests Across All Modules
        run: ./gradlew testDebugUnitTest

      - name: 📚 Generate Dokka API Documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: 📦 Build Release AARs
        run: ./gradlew assembleRelease

      - name: ⬆️ Upload Release AARs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: ./**/build/outputs/aar/*-release.aar
          if-no-files-found: ignore

      # ─── Publicação dos Módulos para GitHub Packages ──────────────────────

      - name: 📦 Publish Changed Modules to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Publishing modules for run number: ${{ github.run_number }}"
          for module in core backend-firebase backend-supabase backend-appwrite backend-back4app backend-amplify backend-pocketbase backend-rest backend-cloudflare; do
            if [ -d "$module" ]; then
              if echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "$module/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "build-logic/" || echo "${{ steps.changed_modules.outputs.all_changed_files }}" | grep -q "gradle/"; then
                echo "Publishing :$module to GitHub Packages..."
                ./gradlew ":$module:publish" --no-daemon
              fi
            fi
          done

      # ─── Criar Tag e Release no GitHub ─────────────────────────────────────

      - name: Configure GitHub Access
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag and Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.changed_modules.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          AAR_FILES=$(find . -path '*/build/outputs/aar/*-release.aar' 2>/dev/null | tr '\n' ' ')
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release automático gerado pela esteira de CI/CD.
            
          **Versão Publicada**: \`0.0.${{ github.run_number }}\`
          **Mudanças detectadas em**:
          ${{ steps.changed_modules.outputs.all_changed_files }}" \
            $AAR_FILES
