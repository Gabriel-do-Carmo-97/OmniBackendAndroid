# SonarQube Configuration for OmniBackendAndroid
# Configuração corporativa para análise estática e métricas de qualidade contínua

# Project identification
sonar.projectKey=OmniBackendAndroid
sonar.organization=gabriel-do-carmo-97
sonar.projectName=OmniBackend Android
sonar.projectVersion=1.0.0

# Source code locations
sonar.sources=core/src/main,backend/firebase/src/main,backend/supabase/src/main,backend/appwrite/src/main,backend/pocketbase/src/main,backend/back4app/src/main,backend/amplify/src/main,backend/cloudflare/src/main,backend/rest/src/main,bundle/all/src/main,bundle/hybrid/src/main,bundle/self-hosted/src/main,bundle/cloud-native/src/main,bundle/enterprise-hybrid/src/main,bundle/edge-serverless/src/main,bundle/baas-classic/src/main,bundle/firebase-supabase/src/main,bundle/firebase-amplify/src/main,bundle/firebase-back4app/src/main,bundle/supabase-cloudflare/src/main,testing/src/main,app/src/main
sonar.tests=core/src/test,backend/firebase/src/test,backend/supabase/src/test,backend/appwrite/src/test,backend/pocketbase/src/test,backend/back4app/src/test,backend/amplify/src/test,backend/cloudflare/src/test,backend/rest/src/test,bundle/all/src/test,bundle/hybrid/src/test,bundle/self-hosted/src/test,bundle/cloud-native/src/test,bundle/enterprise-hybrid/src/test,bundle/edge-serverless/src/test,bundle/baas-classic/src/test,bundle/firebase-supabase/src/test,bundle/firebase-amplify/src/test,bundle/firebase-back4app/src/test,bundle/supabase-cloudflare/src/test,testing/src/test,app/src/test
sonar.sourceEncoding=UTF-8

# Exclude generated files and build artifacts
sonar.exclusions=**/build/**,**/generated/**,**/R.java,**/BuildConfig.java,**/**/*Companion*.kt,**/**/*_MembersInjector*.kt,**/**/*_Factory*.kt,**/**/*_HiltModules*.kt
sonar.test.exclusions=**/build/**,**/generated/**

# Kotlin & Jacoco Coverage settings (utiliza o relatório consolidado raiz)
sonar.kotlin.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml

# Detekt reports integration
sonar.kotlin.detekt.reportPaths=**/build/reports/detekt/detekt.xml

# Android-specific settings
sonar.android.lint.report=**/build/reports/lint-results-*.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Unit test execution reports
sonar.kotlin.surefire.reportPaths=**/build/test-results/testDebugUnitTest/*.xml
sonar.junit.reportPaths=**/build/test-results/testDebugUnitTest/*.xml

# Analysis parameters
sonar.analysis.mode=publish
sonar.issuesReport.html.enable=true
sonar.issuesReport.json.enable=true
